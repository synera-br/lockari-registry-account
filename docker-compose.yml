version: '3.8'

services:
  lockari-backend:
    build:
      dockerfile: build/Dockerfile
      context: .
    container-name: lbackend
    volumes:
      - ./config:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lbackend.rule=Host(`api-stg.lockari.com`)"
      - "traefik.http.routers.lbackend.entrypoints=websecure"
      - "traefik.http.routers.lbackend.tls=true"
      - "traefik.http.routers.lbackend.tls.certresolver=letsencrypt"
      #- "traefik.http.services.lbackend.loadbalancer.server.port=80"
    networks:
        - traefik
networks:
  traefik:
    external: true


