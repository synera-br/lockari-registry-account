  lb-tshoot:
    image: golang:1.24-alpine
    command: ["sleep", "infinity"]
    container_name: lb-tshoot
    volumes:
      - ../config:/config
      - .:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lb-tshoot.rule=Host(`api-stg.lockari.com`)"
      - "traefik.http.routers.lb-tshoot.entrypoints=websecure"
      - "traefik.http.routers.lb-tshoot.tls=true"
      - "traefik.http.routers.lb-tshoot.tls.certresolver=letsencrypt"
      - "traefik.http.services.lb-tshoot.loadbalancer.server.port=80"
    networks:
        - traefik
networks:
  traefik:
    external: true


